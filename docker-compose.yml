services:
  # ── MongoDB ──
  mongodb:
    image: mongo:7
    container_name: skyvoice-mongodb
    restart: unless-stopped
    ports:
      - '27017:27017'
    volumes:
      - mongodb_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: skyvoice

  # ── Redis ──
  redis:
    image: redis:7-alpine
    container_name: skyvoice-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data

  # ── Backend API + voice pipeline ──
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: skyvoice-backend
    restart: unless-stopped
    ports:
      - '3011:3011'
    depends_on:
      - mongodb
      - redis
    environment:
      NODE_ENV: production
      PORT: 3011
      MONGODB_URI: mongodb://mongodb:27017/skyvoice
      REDIS_URL: redis://redis:6379
      FRONTEND_URL: http://localhost:3010
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}

  # ── Frontend (Next.js) ──
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: skyvoice-frontend
    restart: unless-stopped
    ports:
      - '3010:3010'
    depends_on:
      - backend

volumes:
  mongodb_data:
  redis_data:
